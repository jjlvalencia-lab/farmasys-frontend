<div class="login-bg">
  <div class="login-container" [class.shake]="shake">
    <div class="login-logo">🏥</div>
    <h1 class="login-title">FarmaSys</h1>
    <p class="login-subtitle">Sistema de Gestión de Inventario</p>

    <div class="form-group">
      <label>Usuario</label>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input
          type="text"
          [(ngModel)]="username"
          placeholder="Ingresa tu usuario"
          class="input-field"
        />
      </div>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          class="input-field"
        />
        <span class="toggle-password" (click)="togglePassword()">
          {{ mostrarPassword ? '🙈' : '👁️' }}
        </span>
      </div>
    </div>

    <div class="error-msg" *ngIf="error">⚠️ {{ error }}</div>

    <button (click)="login()" class="btn-login">Ingresar</button>

    <p class="login-footer">FarmaSys v1.0 — Todos los derechos reservados</p>
  </div>
</div>
