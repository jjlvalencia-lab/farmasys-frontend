<div class="login-container">
  <div class="login-box">
    <h2>🏥 FarmaSys</h2>
    <p>Sistema de Gestión de Inventario</p>
    <div class="form-group">
      <input type="text" [(ngModel)]="username" placeholder="Usuario" class="input-field"/>
    </div>
    <div class="form-group">
      <input type="password" [(ngModel)]="password" placeholder="Contraseña" class="input-field"/>
    </div>
    <div class="error" *ngIf="error">{{ error }}</div>
    <button (click)="login()" class="btn-login">Ingresar</button>
  </div>
</div>
